[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "levelcraft"
version = "1.0.0"
description = "The Open Source Engineering Seniority & Competency Benchmark Engine for Software Engineers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "LevelCraft Contributors" }
]
keywords = [
    "career",
    "seniority",
    "software-engineering",
    "engineering-management",
    "competency-matrix",
    "career-ladder",
    "skills-assessment",
    "cli"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Utilities"
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
levelcraft = "levelcraft.cli:main"

[project.urls]
Homepage = "https://github.com/alisenn/levelcraft"
Repository = "https://github.com/alisenn/levelcraft"
Issues = "https://github.com/alisenn/levelcraft/issues"

[tool.setuptools.packages.find]
include = ["levelcraft*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=levelcraft"
testpaths = [
    "tests"
]
